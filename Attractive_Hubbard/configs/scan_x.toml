precision = "Float64"
[model]
L = 50
temperature = "0.02"
U = "-4"
mu = "0"
dt = "0.01"
tmin = "-700"
tmax = "700"
tolerance = "1e-12"
epsilon = "0.001"
tau_f = "0.1"
# Student exp[-(t/(sqrt(2)/0.01))^2] equals exp[-t^2/(2*100^2)].
tau_g = "100"
polarization = [1, 0]
field_mode = "table4"
update_mean_field = true
parallel_k = false
[scan]
omega_min = 0.0
omega_max = 5.0
omega_count = 101
amplitudes = ["0.001", "0.01"]
